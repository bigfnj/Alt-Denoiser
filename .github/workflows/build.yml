name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # Ship only the VST3 bundle. The build tree also contains a ~44 MB
      # _SharedCode.lib link intermediate and MSVC .exp/.lib stubs, which were
      # previously published and are unusable to end users.
      #
      # The bundle is located rather than hardcoded: the artefacts directory
      # differs between single- and multi-config generators, and this path has
      # never been verified on macOS or Linux. Missing or ambiguous results are
      # a hard failure, because the previous workflow would have silently
      # published an empty archive.
      - name: Stage VST3 for packaging
        shell: bash
        run: |
          set -eu
          count=$(find build -type d -name '*.vst3' -prune -print | wc -l | tr -d ' ')
          if [ "$count" != "1" ]; then
            echo "::error::expected exactly one .vst3 bundle in build/, found $count"
            find build -maxdepth 3 -type d || true
            exit 1
          fi
          bundle=$(find build -type d -name '*.vst3' -prune -print)
          echo "Found bundle: $bundle"
          mkdir -p dist
          cp -R "$bundle" dist/
          find dist -type f -print

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alt-Denoiser-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Archive artifacts for Release
        run: |
          cd artifacts
          for dir in */; do
            zip -r "${dir%/}.zip" "$dir"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
