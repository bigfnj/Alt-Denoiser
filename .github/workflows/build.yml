name: Build and Release

on:
  push:
    # Tags cut a release. Branch pushes only build and test; the release job
    # below is still gated on refs/tags. Without the branch trigger nothing ran
    # on a normal push, so CI never fired during day-to-day development.
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            xvfb

      # libDF is rebuilt from scratch on every run otherwise, measured at 2m37s
      # locally for the Release profile alone.
      - name: Cache libDF build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            modules/DeepFilterNet/target
          key: ${{ runner.os }}-libdf-${{ hashFiles('modules/DeepFilterNet/libDF/Cargo.toml', 'modules/DeepFilterNet/libDF/src/**') }}
          restore-keys: ${{ runner.os }}-libdf-

      # Note on the two build-type flags: they are not redundant. CMake reports
      # CMAKE_BUILD_TYPE as unused on multi-config generators (Windows, Xcode),
      # and --config is the no-op on single-config ones (Linux). Each covers the
      # generator the other misses.
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # pluginval passes this plugin at strictness 5 with serious audio defects
      # present, because it validates VST3 well-formedness rather than audio
      # correctness. This harness renders audio and asserts on the samples.
      - name: Run offline harness
        shell: bash
        run: |
          set -eu
          exe=$(find build -type f \( -name AltDenoiserTests -o -name AltDenoiserTests.exe \) | head -n 1)
          if [ -z "$exe" ]; then
            echo "::error::AltDenoiserTests binary not found"
            find build -name 'AltDenoiser*' -maxdepth 4 || true
            exit 1
          fi
          echo "Harness: $exe"

          # JUCE initialises a MessageManager, which needs a display on Linux.
          RUN=""
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a"; fi

          # Cover the geometries that used to behave differently: a block size
          # that is a multiple of the 480-sample model hop, one that is not, and
          # rates that require real resampling in both directions.
          for cfg in "480 48000" "512 48000" "1024 48000" "512 44100" "1024 96000"; do
            echo "--- block/rate: $cfg ---"
            $RUN "$exe" $cfg
          done

      # Ship only the VST3 bundle. The build tree also contains a ~44 MB
      # _SharedCode.lib link intermediate and MSVC .exp/.lib stubs, which were
      # previously published and are unusable to end users.
      #
      # The bundle is located rather than hardcoded: the artefacts directory
      # differs between single- and multi-config generators, and this path has
      # never been verified on macOS or Linux. Missing or ambiguous results are
      # a hard failure, because the previous workflow would have silently
      # published an empty archive.
      - name: Stage VST3 for packaging
        shell: bash
        run: |
          set -eu
          count=$(find build -type d -name '*.vst3' -prune -print | wc -l | tr -d ' ')
          if [ "$count" != "1" ]; then
            echo "::error::expected exactly one .vst3 bundle in build/, found $count"
            find build -maxdepth 3 -type d || true
            exit 1
          fi
          bundle=$(find build -type d -name '*.vst3' -prune -print)
          echo "Found bundle: $bundle"
          mkdir -p dist
          cp -R "$bundle" dist/

          # LIC1: this is an AGPLv3 work, so the licence must travel with the
          # binary. Upstream published releases with no licence text at all,
          # because the repository had no LICENSE file to include.
          test -f LICENSE || { echo "::error::LICENSE is missing"; exit 1; }
          cp LICENSE dist/
          cp README.md dist/

          find dist -type f -print

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alt-Denoiser-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Archive artifacts for Release
        run: |
          cd artifacts
          for dir in */; do
            zip -r "${dir%/}.zip" "$dir"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
