name: Build and Release

on:
  push:
    # Tags cut a release. Branch pushes only build and test; the release job
    # below is still gated on refs/tags. Without the branch trigger nothing ran
    # on a normal push, so CI never fired during day-to-day development.
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          # apt-get update exits 100 if ANY index fails, including third-party
          # repos preinstalled on the runner image that this project does not
          # use. A Chrome repo hash-sum mismatch failed a build here once. Index
          # errors are downgraded to a visible warning and the install below is
          # the real gate: it still fails loudly if a package we need is missing.
          sudo apt-get update -o Acquire::Retries=3             || echo "::warning::apt-get update reported index errors; continuing, the install step gates this"
          sudo apt-get install -y \
            libasound2-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            xvfb

      # libDF is rebuilt from scratch on every run otherwise, measured at 2m37s
      # locally for the Release profile alone.
      # Caches libs/alt_df/target, which is where cargo writes since the shim
      # replaced libDF's capi. This pointed at modules/DeepFilterNet/target until
      # 2026-09-09, a directory nothing builds into any more, so every run after
      # the shim landed recompiled tract from scratch and hit the cache on
      # nothing but the registry.
      #
      # The key hashes libDF's sources as well as the shim's, because the shim
      # takes libDF as a path dependency and a change there must invalidate. It
      # hashes Cargo.lock too: the lockfile pins tract to 0.21.4, and libDF does
      # not compile against the 0.21.18 a fresh resolution picks.
      - name: Cache the Rust shim build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            libs/alt_df/target
          key: ${{ runner.os }}-alt-df-${{ hashFiles('libs/alt_df/Cargo.lock', 'libs/alt_df/Cargo.toml', 'libs/alt_df/src/**', 'modules/DeepFilterNet/libDF/Cargo.toml', 'modules/DeepFilterNet/libDF/src/**') }}
          restore-keys: ${{ runner.os }}-alt-df-

      # Note on the two build-type flags: they are not redundant. CMake reports
      # CMAKE_BUILD_TYPE as unused on multi-config generators (Windows, Xcode),
      # and --config is the no-op on single-config ones (Linux). Each covers the
      # generator the other misses.
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # Download pluginval so the gate runs its format-validation stage.
      # Version-pinned: 1.0.3 is the version whose behaviour this project has
      # actually measured.
      - name: Install pluginval
        shell: bash
        run: |
          set -eu
          case "$RUNNER_OS" in
            Windows) asset=pluginval_Windows.zip ;;
            macOS)   asset=pluginval_macOS.zip ;;
            Linux)   asset=pluginval_Linux.zip ;;
          esac
          curl -fsSL -o pv.zip             "https://github.com/Tracktion/pluginval/releases/download/v1.0.3/${asset}"
          mkdir -p pv && (cd pv && unzip -q ../pv.zip)
          exe=$(find pv -type f \( -name pluginval -o -name pluginval.exe \) | head -n 1)
          if [ -z "$exe" ]; then
            exe=$(find pv -type d -name 'pluginval.app' -prune -print | head -n 1)/Contents/MacOS/pluginval
          fi
          chmod +x "$exe" || true
          echo "PLUGINVAL=$PWD/$exe" >> "$GITHUB_ENV"

      # The SAME script developers run locally, so a green tick here and a green
      # run on a workstation mean the same thing. It builds, runs the offline
      # harness across five geometries, runs pluginval, and checks the packaging
      # shape. It reports DEGRADED rather than clean if a stage is skipped.
      - name: Verification gate
        shell: bash
        run: bash scripts/gate.sh build

      # Ship only the plugin bundles. The build tree also contains a ~44 MB
      # _SharedCode.lib link intermediate and MSVC .exp/.lib stubs, which were
      # previously published and are unusable to end users.
      #
      # One directory per format, uploaded as its own artifact, because
      # BACKLOG.md PKG1 measured that a combined zip makes every user fetch
      # every format: zip's 32 KB window cannot deduplicate the model and the
      # runtime across near-identical binaries.
      #
      # Each bundle is located rather than hardcoded: the artefacts directory
      # differs between single- and multi-config generators, and this path has
      # never been verified on macOS or Linux. Missing or ambiguous results are
      # a hard failure, because the previous workflow would have silently
      # published an empty archive. Every shipped format gets that same guard,
      # not just VST3.
      #
      # AU is a `.component/` directory and LV2 a `.lv2/` directory holding the
      # .so plus its .ttl manifests, so both match the -type d -prune idiom.
      - name: Stage plugin formats for packaging
        shell: bash
        run: |
          set -eu

          stage_one() {
            ext="$1"
            count=$(find build -type d -name "*.$ext" -prune -print | wc -l | tr -d ' ')
            if [ "$count" != "1" ]; then
              echo "::error::expected exactly one .$ext bundle in build/, found $count"
              find build -maxdepth 3 -type d || true
              exit 1
            fi
            bundle=$(find build -type d -name "*.$ext" -prune -print)
            echo "Found $ext bundle: $bundle"
            mkdir -p "dist/$ext"
            cp -R "$bundle" "dist/$ext/"

            # LIC1: this is an AGPLv3 work, so the licence must travel with the
            # binary. Upstream published releases with no licence text at all,
            # because the repository had no LICENSE file to include. Each format
            # is downloaded on its own, so each one carries its own copy.
            test -f LICENSE || { echo "::error::LICENSE is missing"; exit 1; }
            cp LICENSE "dist/$ext/"
            cp README.md "dist/$ext/"
          }

          case "$RUNNER_OS" in
            Windows) formats="vst3" ;;
            macOS)   formats="vst3 component" ;;
            Linux)   formats="vst3 lv2" ;;
            *)       echo "::error::unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac

          for ext in $formats; do
            stage_one "$ext"
          done

          find dist -type f -print

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alt-Denoiser-${{ matrix.name }}-VST3
          path: dist/vst3/
          if-no-files-found: error

      - name: Upload AU artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Alt-Denoiser-${{ matrix.name }}-AU
          path: dist/component/
          if-no-files-found: error

      - name: Upload LV2 artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Alt-Denoiser-${{ matrix.name }}-LV2
          path: dist/lv2/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Archive artifacts for Release
        run: |
          cd artifacts
          for dir in */; do
            zip -r "${dir%/}.zip" "$dir"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
